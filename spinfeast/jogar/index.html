 for(let i=0;i<P.length;i++){if(i)s+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);P[i].s=s;
  const a=P[Math.max(0,i-1)],b=P[Math.min(P.length-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;P[i].nx=-dy/l;P[i].ny=dx/l;}
 L=P[P.length-1].s;beltPath=new Path2D();P.forEach((p,i)=>i?beltPath.lineTo(p.x,p.y):beltPath.moveTo(p.x,p.y));}
function pointAt(s){let lo=0,hi=P.length-1;if(s<=0)return P[0];if(s>=L)return P[hi];
 while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].s<s)lo=m;else hi=m;}
 const a=P[lo],b=P[hi],f=(s-a.s)/((b.s-a.s)||1);return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};}

  if(step%2===0&&beat%m.beats===0)pluck(noteF(m,chord,-1),musicT,sp*m.beats*1.6,'triangle',0.035);

 ouviu."],"c":["Espreita a tasca! 👀","Volta à cozinha! 🍳","Os clientes estão à espera! 🍽️"]},"pt-BR":{"t":"Ajuda","q":[["Como ganho mais moedas?","Melhore as estações (os níveis 10, 25, 50 e 100 dobram o valor do prato), contrate chefs, aumente a velocidade e toque na tela para acelerar."],["Por que os clientes vão embora bravos?","Eles esperaram demais. Contrate mais chefs, aumente a velocidade ou use o booster Calma 🧘."],["Perco o progresso se fechar o jogo?","Não. O jogo salva sozinho e continua faturando por até 2 horas enquanto você está fora."],["Para que servem as estrelas?","Você ganha até 3 estrelas por cidade (quanto mais rápido, mais estrelas). Use-as no mapa em melhorias permanentes."],["Como ganho gemas sem pagar?","Com conquistas, missões, cidades concluídas, o prêmio diário, o Caderno da Vovó Rosa, os eventos e até 5 vídeos por dia na loja."],["O que é o Caderno da Vovó Rosa? 📒","Uma coleção com os pratos, os clientes especiais e os eventos de cada cidade. Complete as páginas para ganhar gemas."],["O que são os eventos? 🎉","Dias especiais em que as moedas valem mais, como o fim de semana dourado ou as festas de cada cidade. Jogue durante um evento para ganhar o selo."],["Sou obrigado a ver anúncios?","Não. Você só vê um vídeo quando toca em um botão com 📺 para ganhar um prêmio."],["Comprei e não recebi. O que faço?","Toque em ⚙️ › 🛍️ (restaurar compras). Se não resolver, escreva para nós com o número do pedido do Google Play."],["Onde uso um código? 🎟️","Em ⚙️ › 🎟️. Cada código só pode ser usado uma vez em cada celular."],["Posso jogar sem internet?","Sim. Só os vídeos e as compras precisam de conexão."]],"ch":"Lembretes","n":["O cofre do restaurante está cheio! Venha recolher as moedas. 🪙","A Vovó Rosa deixou um presente para você no balcão. 🎁","Fim de semana dourado: tudo vale ×1,5 até domingo! 🌟","Os clientes estão perguntando por você. A esteira está com saudade! 🌀"],"s":["Seu chef está fazendo malabarismo com pastéis de nata.","A Vovó Rosa jura que a esteira está girando sozinha.","Um cliente VIP já contou as moedas três vezes.","A sardinha pediu férias, mas ninguém ouviu."],"c":["Dá uma olhada no restaurante! 👀","Volte para a cozinha! 🍳","Os clientes estão esperando! 🍽️"]},"en-GB":{"t":"Help","q":[["How do I earn more coins?","Upgrade your stations (levels 10, 25, 50 and 100 double the dish value), hire chefs, raise the speed and tap the screen to speed up."],["Why do customers leave angry?","They waited too long. Hire more chefs, raise the speed or use the Calm booster 🧘."],["Do I lose my progress if I close the game?","No. The game saves automatically and keeps earning for up to 2 hours while you're away."],["What are stars for?","You earn up to 3 stars per city (the faster, the more stars). Spend them on the map on permanent upgrades."],["How do I get gems for free?","From achievements, missions, finished cities, the daily reward, Grandma Rosa's Notebook, events and up to 5 videos a day in the shop."],["What is Grandma Rosa's Notebook? 📒","A collection of the dishes, special customers and events of each city. Complete the pages to earn gems."],["What are events? 🎉","Special days when coins are worth more, like the golden weekend or each city's festivals. Play during an event to earn its stamp."],["Do I have to watch ads?","No. You only watch a video when you tap a button with 📺 to get a reward."],["I bought something and didn't get it. What should I do?","Tap ⚙️ › 🛍️ (restore purchases). If that doesn't help, email us with your Google Play order number."],["Where do I use a code? 🎟️","In ⚙️ › 🎟️. Each code can only be used once per phone."],["Can I play offline?","Yes. Only videos and purchases need a connection."]],"ch":"Reminders","n":["The diner's safe is full! Come and collect your coins. 🪙","Grandma Rosa left you a present on the counter. 🎁","Golden weekend: everything is worth ×1.5 until Sunday! 🌟","Customers are asking about you. The belt misses you! 🌀"],"s":["Your chef is juggling custard tarts. . Solo los videos y las compras necesitan conexión."]],"ch":"Recordatorios","n":["¡La caja del restaurante está llena! Ven a recoger las monedas. 🪙","La abuela Rosa te dejó un regalo en el mostrador. 🎁","Fin de semana dorado: ¡todo vale ×1.5 hasta el domingo! 🌟","Los clientes preguntan por ti. ¡La banda te extraña! 🌀"],"s":["Tu chef está haciendo malabares con pastelitos de nata.","La abuela Rosa jura que la banda gira sola.","Un cliente VIP ya contó sus monedas tres veces.","La sardina pidió vacaciones, pero nadie la escuchó."],"c":["¡Échale un ojo al restaurante! 👀","¡Regresa a la cocina! 🍳","¡Los clientes te esperan! 🍽️"]},"fr":{"t":"Aide","q":[["Comment gagner plus de pièces ?","Améliore les postes (les niveaux 10, 25, 50 et 100 doublent la valeur du plat), engage des chefs, augmente la vitesse et touche l'écran pour accélérer."],["Pourquoi les clients partent-ils fâchés ?","Ils ont attendu trop longtemps. Engage plus de chefs, augmente la vitesse ou utilise le booster Calme 🧘."],["Est-ce que je perds ma progression si je ferme le jeu ?","Non. Le jeu sauvegarde tout seul et continue de rapporter jusqu'à 2 heures pendant ton absence."],["À quoi servent les étoiles ?","Tu gagnes jusqu'à 3 étoiles par ville (plus tu vas vite, plus tu en gagnes). Dépense-les sur la carte en améliorations permanentes."],["Comment obtenir des gemmes gratuitement ?","Avec les succès, les missions, les villes terminées, la récompense quotidienne, le Carnet de Mamie Rosa, les événements et jusqu'à 5 vidéos par jour dans la boutique."],["Qu'est-ce que le Carnet de Mamie Rosa ? 📒","Une collection des plats, des clients spéciaux et des événements de chaque ville. Complète les pages pour gagner des gemmes."],["Que sont les événements ? 🎉","Des jours spéciaux où les pièces valent plus, comme le week-end doré ou les fêtes de chaque ville. Joue pendant un événement pour gagner son tampon."],["Suis-je obligé de regarder des pubs ?","Non. Tu ne regardes une vidéo que si tu touches un bouton avec 📺 pour gagner une récompense."],["Mon achat n'est pas arrivé. Que faire ?","Touche ⚙️ › 🛍️ (restaurer les achats). Si ça ne suffit pas, écris-nous avec ton numéro de commande Google Play."],["Où utiliser un code ? 🎟️","Dans ⚙️ › 🎟️. Chaque code ne peut être utilisé qu'une fois par téléphone."],["Puis-je jouer sans internet ?","Oui. Seuls les vidéos et les achats ont besoin d'une connexion."]],"ch":"Rappels","n":["Le coffre du resto est plein ! Viens récupérer tes pièces. 🪙","Mamie Rosa t'a laissé un cadeau sur le comptoir. 🎁","Week-end doré : tout vaut ×1,5 jusqu'à dimanche ! 🌟","Les clients te réclament. Le tapis s'ennuie de toi ! 🌀"],"s":["Ton chef jongle avec des pastéis de nata.","Mamie Rosa jure que le tapis tourne tout seul.","Un client VIP a déjà compté ses pièces trois fois.","La sardine a demandé des vacances, mais personne ne l'a écoutée."],"c":["Viens jeter un œil au resto ! 👀","Retour en cuisine ! 🍳","Les clients t'attendent ! 🍽️"]},"de":{"t":"Hilfe","q":[["Wie verdiene ich mehr Münzen?","Verbessere die Stationen (die Stufen 10, 25, 50 und 100 verdoppeln den Wert des Gerichts), stelle Köche ein, erhöhe das Tempo und tippe auf den Bildschirm, um zu beschleunigen."],["Warum gehen Gäste verärgert?","Sie haben zu lange gewartet. Stelle mehr Köche ein, erhöhe das Tempo oder nutze den Booster Ruhe 🧘."],["Verliere ich meinen Fortschritt, wenn ich das Spiel schließe?","Nein. Das Spiel speichert automatisch und verdient bis zu 2 Stunden weiter, während du weg bist."],["Wofür sind die Sterne?","Du bekommst bis zu 3 Sterne pro Stadt (je schneller, desto mehr). Gib sie auf der Karte für dauerhafte Verbesserungen aus."],["Wie bekomme ich kostenlos Edelsteine?","Durch Erfolge, Missionen, abgeschlossene Städte, die tägliche Belohnung, Oma Rosas Notizbuch, Events und bis zu 5 Videos pro Tag im Shop."],["Was ist Oma Rosas Notizbuch? 📒","Eine Sammlung der Gerichte, besonderen Gäste und Events jeder Stadt. Vervollständige die Seiten, um Edelsteine zu verdienen."],["Was sind Events? 🎉","Besondere Tage, an denen Münzen mehr wert sind, wie das goldene Wochenende oder die Feste jeder Stadt. Spiele während eines Events, um seinen Stempel zu bekommen."],["Muss ich Werbung ansehen?","Nein. Du siehst nur dann ein Video, wenn du auf eine Taste mit 📺 tippst, um eine Belohnung zu bekommen."],["Mein Kauf ist nicht angekommen. Was tun?","Tippe auf ⚙️ › 🛍️ (Käufe wiederherstellen). Wenn das nicht hilft, schreib uns mit deiner Google-Play-Bestellnummer."],["Wo löse ich einen Code ein? 🎟️","Unter ⚙️ › 🎟️. Jeder Code kann pro Handy nur einmal verwendet werden."],["Kann ich offline spielen?","Ja. Nur Videos und Käufe brauchen eine Verbindung."]],"ch":"Erinnerungen","n":["Die Kasse des Lokals ist voll! Hol dir deine Münzen. 🪙","Oma Rosa hat dir ein Geschenk auf die Theke gelegt. 🎁","Goldenes Wochenende: Alles ist bis Sonntag ×1,5 wert! 🌟","Die Gäste fragen nach dir. Das Band vermisst dich! 🌀"],"s":["Dein Koch jongliert mit Pastéis de Nata.","Oma Rosa schwört, dass sich das Band von selbst dreht.","Ein VIP-Gast hat seine Münzen schon dreimal gezählt.","Die Sardine wollte Urlaub, aber niemand hat ihr zugehört."],"c":["Schau mal im Lokal vorbei! 👀","Zurück in die Küche! 🍳","Die Gäste warten! 🍽️"]},"it":{"t":"Aiuto","q":[["Come guadagno più monete?","Migliora le postazioni (i livelli 10, 25, 50 e 100 raddoppiano il valore del piatto), assumi chef, aumenta la velocità e tocca lo schermo per accelerare."],["Perché i clienti se ne vanno arrabbiati?","Hanno aspettato troppo. Assumi più chef, aumenta la velocità o usa il booster Calma 🧘."],["Perdo i progressi se chiudo il gioco?","No. Il gioco salva da solo e continua a guadagnare fino a 2 ore mentre sei via."],["A cosa servono le stelle?","Ottieni fino a 3 stelle per città (più sei veloce, più stelle). Spendile sulla mappa in miglioramenti permanenti."],["Come ottengo gemme gratis?","Con obiettivi, missioni, città completate, il premio giornaliero, il Quaderno di Nonna Rosa, gli eventi e fino a 5 video al giorno nel negozio."],["Cos'è il Quaderno di Nonna Rosa? 📒","Una collezione dei piatti, dei clienti speciali e degli eventi di ogni città. Completa le pagine per guadagnare gemme."],["Cosa sono gli eventi? 🎉","Giorni speciali in cui le monete valgono di più, come il weekend d'oro o le feste di ogni città. Gioca durante un evento per ottenere il suo timbro."],["Devo per forza guardare la pubblicità?","No. Guardi un video solo quando tocchi un pulsante con 📺 per ottenere un premio."],["Ho comprato qualcosa e non l'ho ricevuto. Cosa faccio?","Tocca ⚙️ › 🛍️ (ripristina acquisti). Se non basta, scrivici con il numero d'ordine di Google Play."],["Dove uso un codice? 🎟️","In ⚙️ › 🎟️. Ogni codice si può usare una sola volta per telefono."],["Posso giocare senza internet?","Sì. Solo i video e gli acquisti richiedono una connessione."]],"ch":"Promemoria","n":["La cassa del locale è piena! Vieni a ritirare le monete. 🪙","Nonna Rosa ti ha lasciato un regalo sul bancone. 🎁","Weekend d'oro: tutto vale ×1,5 fino a domenica! 🌟","I clienti chiedono di te. Il nastro sente la tua mancanza! 🌀"],"s":["Il tuo chef fa il giocoliere con i pastéis de nata.","Nonna Rosa giura che il nastro gira da solo.","Un cliente VIP ha già contato le sue monete tre volte.","La sardina ha chiesto le ferie, ma nessuno l'ha ascoltata."],"c":["Dai un'occhiata al locale! 👀","Torna in cucina! 🍳","I clienti ti aspettano! 🍽️"]},"pl":{"t":"Pomoc","q":[["Jak zarobić więcej monet?","Ulepszaj stanowiska (poziomy 10, 25, 50 i 100 podwajają wartość dania), zatrudniaj kucharzy, zwiększaj szybkość i stukaj w ekran, aby przyspieszyć."],["Dlaczego goście odchodzą źli?","Czekali za długo. Zatrudnij więcej kucharzy, zwiększ szybkość albo użyj boostera Spokój 🧘."],["Czy stracę postępy, jeśli zamknę grę?","Nie. Gra zapisuje się sama i zarabia jeszcze do 2 godzin, gdy cię nie ma."],["Do czego służą gwiazdki?","Zdobywasz do 3 gwiazdek w każdym mieście (im szybciej, tym więcej). Wydawaj je na mapie na stałe ulepszenia."],["Jak zdobyć klejnoty za darmo?","Za osiągnięcia, misje, ukończone miasta, codzienną nagrodę, Zeszyt Babci Rosy, wydarzenia i do 5 filmów dziennie w sklepie."],["Czym jest Zeszyt Babci Rosy? 📒","To kolekcja dań, wyjątkowych gości i wydarzeń z każdego miasta. Uzupełniaj strony, aby zdobywać klejnoty."],["Czym są wydarzenia? 🎉","To specjalne dni, gdy monety są warte więcej, jak złoty weekend czy święta poszczególnych miast. Graj podczas wydarzenia, aby zdobyć jego pieczątkę."],["Czy muszę oglądać reklamy?","Nie. Film oglądasz tylko wtedy, gdy dotkniesz przycisku z 📺, aby zdobyć nagrodę."],["Zakup nie dotarł. Co robić?","Dotknij ⚙️ › 🛍️ (przywróć zakupy). Jeśli to nie pomoże, napisz do nas z numerem zamówienia Google Play."],["Gdzie wpisać kod? 🎟️","W ⚙️ › 🎟️. Każdego kodu można użyć tylko raz na jednym telefonie."],["Czy mogę grać bez internetu?","Tak. Połączenia potrzebują tylko filmy i zakupy."]],"ch":"Przypomnienia","n":["Kasa w restauracji jest pełna! Odbierz monety. 🪙","Babcia Rosa zostawiła ci prezent na ladzie. 🎁","Złoty weekend: wszystko jest warte ×1,5 do niedzieli! 🌟","Goście o ciebie pytają. Taśma tęskni! 🌀"],"s":["Twój kucharz żongluje babeczkami pastéis de nata.","Babcia Rosa przysięga, że taśma kręci się sama.","Gość VIP przeliczył już swoje monety trzy razy.","Sardynka poprosiła o urlop, ale nikt jej nie słuchał."],"c":["Zajrzyj do restauracji! 👀","Wracaj do kuchni! 🍳","Goście czekają! 🍽️"]},"ru":{"t":"Помощь","q":[["Как заработать больше монет?","Улучшай прилавки (уровни 10, 25, 50 и 100 удваивают цену блюда), нанимай поваров, повышай скорость и нажимай на экран, чтобы ускориться."],["Почему гости уходят сердитыми?","Они ждали слишком долго. Найми больше поваров, повысь скорость или используй бустер «Спокойствие» 🧘."],["Пропадёт ли прогресс, если закрыть игру?","Нет. Игра сохраняется сама и приносит доход до 2 часов, пока тебя нет."],["Зачем нужны звёзды?","В каждом городе можно получить до 3 звёзд (чем быстрее, тем больше). Трать их на карте на постоянные улучшения."],["Как получить кристаллы бесплатно?","За достижения, задания, пройденные города, ежедневную награду, тетрадь бабушки Розы, события и до 5 видео в день в магазине."],["Что такое тетрадь бабушки Розы? 📒","Коллекция блюд, особых гостей и событий каждого города. Заполняй страницы, чтобы получать кристаллы."],["Что такое события? 🎉","Особые дни, когда монеты стоят дороже, например золотые выходные или праздники городов. Играй во время события, чтобы получить его печать."],["Нужно ли смотреть рекламу?","Нет. Видео показывается, только если ты нажмёшь кнопку с 📺, чтобы получить награду."],["Покупка не пришла. Что делать?","Нажми ⚙️ › 🛍️ (восстановить покупки). Если не поможет, напиши нам и укажи номер заказа Google Play."],["Где ввести код? 🎟️","В ⚙️ › 🎟️. Каждый код можно использовать только один раз на одном телефоне."],["Можно играть без интернета?","Да. Подключение нужно только для видео и покупок."]],"ch":"Напоминания","n":["Касса ресторана полна! Забери свои монеты. 🪙","Бабушка Роза оставила тебе подарок на стойке. 🎁","Золотые выходные: всё стоит ×1,5 до воскресенья! 🌟","Гости спрашивают о тебе. Лента скучает! 🌀"],"s":["Твой повар жонглирует пирожными паштел-де-ната.","Бабушка Роза клянётся, что лента крутится сама.","VIP-гость уже трижды пересчитал свои монеты.","Сардина попросилась в отпуск, но её никто не услышал."],"c":["Загляни в ресторан! 👀","Возвращайся на кухню! 🍳","Гости ждут! 🍽️"]},"uk":{"t":"Допомога","q":[["Як заробити більше монет?","Покращуй прилавки (рівні 10, 25, 50 і 100 подвоюють ціну страви), наймай кухарів, підвищуй швидкість і торкайся екрана, щоб пришвидшити."],["Чому гості йдуть сердитими?","Вони чекали надто довго. Найми більше кухарів, підвищ швидкість або скористайся бустером «Спокій» 🧘."],["Чи зникне прогрес, якщо закрити гру?","Ні. Гра зберігається сама й приносить дохід до 2 годин, поки тебе немає."],["Навіщо зірки?","У кожному місті можна отримати до 3 зірок (що швидше, то більше). Витрачай їх на мапі на постійні покращення."],["Як отримати кристали безкоштовно?","За досягнення, завдання, пройдені міста, щоденну нагороду, зошит бабусі Рози, події та до 5 відео на день у крамниці."],["Що таке зошит бабусі Рози? 📒","Колекція страв, особливих гостей і подій кожного міста. Заповнюй сторінки, щоб отримувати кристали."],["Що таке події? 🎉","Особливі дні, коли монети коштують більше, як-от золоті вихідні чи свята міст. Грай під час події, щоб отримати її печатку."],["Чи треба дивитися рекламу?","Ні. Відео з'являється, лише коли ти торкаєшся кнопки з 📺, щоб отримати нагороду."],["Покупка не надійшла. Що робити?","Торкнися ⚙️ › 🛍️ (відновити покупки). Якщо не допоможе, напиши нам і вкажи номер замовлення Google Play."],["Де ввести код? 🎟️","У ⚙️ › 🎟️. Кожен код можна використати лише раз на одному телефоні."],["Чи можна грати без інтернету?","Так. Підключення потрібне лише для відео та покупок."]],"ch":"Нагадування","n":["Каса ресторану повна! Забери свої монети. 🪙","Бабуся Роза залишила тобі подарунок на стійці. 🎁","Золоті вихідні: усе коштує ×1,5 до неділі! 🌟","Гості питають про тебе. Стрічка сумує! 🌀"],"s":["Твій кухар жонглює тістечками паштел-де-ната.","Бабуся Роза присягається, що стрічка крутиться сама.","VIP-гість уже тричі перерахував свої монети.","Сардина попросилася у відпустку, але ніхто її не почув."],"c":["Зазирни в ресторан! 👀","Повертайся на кухню! 🍳","Гості чекають! 🍽️"]},"tr":{"t":"Yardım","q":[["Nasıl daha çok para kazanırım?","Tezgâhları geliştir (10, 25, 50 ve 100. seviyeler yemeğin değerini ikiye katlar), aşçı tut, hızı artır ve hızlandırmak için ekrana dokun."],["Müşteriler neden kızgın gidiyor?","Çok uzun beklediler. Daha fazla aşçı tut, hızı artır ya da Sakinlik güçlendiricisini 🧘 kullan."],["Oyunu kapatırsam ilerlemem kaybolur mu?","Hayır. Oyun kendini kaydeder ve sen yokken 2 saate kadar kazanmaya devam eder."],["Yıldızlar ne işe yarar?","Her şehirde 3 yıldıza kadar kazanırsın (ne kadar hızlıysan o kadar çok). Onları haritada kalıcı geliştirmelere harca."],["Ücretsiz mücevher nasıl kazanırım?","Başarımlar, görevler, bitirilen şehirler, günlük ödül, Rosa Nine'nin Defteri, etkinlikler ve mağazada günde 5 videoya kadar."],["Rosa Nine'nin Defteri nedir? 📒","Her şehrin yemeklerinden, özel müşterilerinden ve etkinliklerinden oluşan bir koleksiyon. Mücevher kazanmak için sayfaları tamamla."],["Etkinlikler nedir? 🎉","Paraların daha değerli olduğu özel günler; altın hafta sonu ya da şehir festivalleri gibi. Mührünü kazanmak için etkinlik sırasında oyna."],["Reklam izlemek zorunda mıyım?","Hayır. Video yalnızca ödül almak için 📺 olan bir düğmeye dokunduğunda oynar."],["Satın aldığım şey gelmedi. Ne yapmalıyım?","⚙️ › 🛍️ (satın alımları geri yükle) seçeneğine dokun. Sorun devam ederse Google Play sipariş numaranla bize yaz."],["Kodu nerede kullanırım? 🎟️","⚙️ › 🎟️ içinde. Her kod bir telefonda yalnızca bir kez kullanılabilir."],["İnternetsiz oynayabilir miyim?","Evet. Yalnızca videolar ve satın alımlar bağlantı gerektirir."]],"ch":"Hatırlatıcılar","n":["Lokantanın kasası doldu! Gel, paralarını topla. 🪙","Rosa Nine tezgâha sana bir hediye bıraktı. 🎁","Altın hafta sonu: Pazar gününe kadar her şey ×1,5 değerinde! 🌟","Müşteriler seni soruyor. Bant seni özledi! 🌀"],"s":["Aşçın pastel de nata'larla jonglörlük yapıyor.","Rosa Nine bandın kendi kendine döndüğüne yemin ediyor.","VIP bir müşteri paralarını üç kez saydı bile.","Sardalya tatil istedi ama kimse onu dinlemedi."],"c":["Lokantaya bir göz at! 👀","Mutfağa dön! 🍳","Müşteriler bekliyor! 🍽️"]},"zh-Hans":{"t":"帮助","q":[["怎样赚更多金币？","升级餐台（第 10、25、50 和 100 级会让菜品价值翻倍），雇佣厨师，提高速度，并点击屏幕加速。"],["顾客为什么生气地离开？","他们等太久了。雇佣更多厨师、提高速度，或使用“冷静”道具 🧘。"],["关闭游戏会丢失进度吗？","不会。游戏会自动保存，你离开期间还会继续赚钱，最长 2 小时。"],["星星有什么用？","每座城市最多可得 3 颗星（越快星越多）。在地图上用星星购买永久升级。"],["怎样免费获得宝石？","完成成就、任务、城市、每日奖励、罗莎奶奶的笔记本和活动，还可以在商店每天看最多 5 个视频。"],["什么是罗莎奶奶的笔记本？📒","收集每座城市的菜品、特别顾客和活动。集满一页即可获得宝石。"],["什么是活动？🎉","金币更值钱的特别日子，比如黄金周末或各城市的节日。在活动期间游戏即可获得活动印章。"],["必须看广告吗？","不必。只有当你点击带 📺 的按钮领取奖励时才会播放视频。"],["购买后没有收到怎么办？","点击 ⚙️ › 🛍️（恢复购买）。如果仍未解决，请附上 Google Play 订单号发邮件给我们。"],["在哪里使用兑换码？🎟️","在 ⚙️ › 🎟️。每个兑换码在每部手机上只能使用一次。"],["可以离线玩吗？","可以。只有视频和购买需要联网。"]],"ch":"提醒","n":["餐厅的钱箱满啦！快来收金币。🪙","罗莎奶奶在柜台上给你留了一份礼物。🎁","黄金周末：周日前一切收益 ×1.5！🌟","顾客都在问你去哪儿了。传送带想你啦！🌀"],"s":["你的厨师正在用葡式蛋挞玩杂耍。","罗莎奶奶发誓传送带自己转了起来。","一位 VIP 顾客已经把金币数了三遍。","沙丁鱼申请休假，可没人听它的。"],"c":["快来看看餐厅！👀","回厨房吧！🍳","顾客在等你！🍽️"]},"zh-Hant":{"t":"說明","q":[["怎樣賺更多金幣？","升級餐台（第 10、25、50 和 100 級會讓菜色價值翻倍），僱用廚師，提高速度，並點擊螢幕加速。"],["顧客為什麼生氣離開？","他們等太久了。僱用更多廚師、提高速度，或使用「冷靜」道具 🧘。"],["關閉遊戲會遺失進度嗎？","不會。遊戲會自動儲存，你離開時還會繼續賺錢，最長 2 小時。"],["星星有什麼用？","每座城市最多可得 3 顆星（越快星越多）。在地圖上用星星購買永久升級。"],["怎樣免費獲得寶石？","完成成就、任務、城市、每日獎勵、羅莎奶奶的筆記本和活動，還可以在商店每天看最多 5 支影片。"],["什麼是羅莎奶奶的筆記本？📒","收集每座城市的菜色、特別顧客和活動。集滿一頁即可獲得寶石。"],["什麼是活動？🎉","金幣更值錢的特別日子，例如黃金週末或各城市的節慶。在活動期間遊玩即可獲得活動印章。"],["一定要看廣告嗎？","不必。只有在你點擊帶 📺 的按鈕領取獎勵時才會播放影片。"],["購買後沒有收到怎麼辦？","點擊 ⚙️ › 🛍️（恢復購買）。如果仍未解決，請附上 Google Play 訂單編號寄信給我們。"],["在哪裡使用兌換碼？🎟️","在 ⚙️ › 🎟️。每個兌換碼在每支手機上只能使用一次。"],["可以離線玩嗎？","可以。只有影片和購買需要連網。"]],"ch":"提醒","n":["餐廳的錢箱滿了！快來收金幣。🪙","羅莎奶奶在櫃檯上留了一份禮物給你。🎁","黃金週末：週日前一切收益 ×1.5！🌟","顧客都在問你去哪了。輸送帶想你囉！🌀"],"s":["你的廚師正拿葡式蛋塔玩雜耍。","羅莎奶奶發誓輸送帶自己轉了起來。","一位 VIP 顧客已經把金幣數了三遍。","沙丁魚申請休假，可是沒人理它。"],"c":["快來看看餐廳！👀","回廚房吧！🍳","顧客在等你！🍽️"]},"ja":{"t":"ヘルプ","q":[["コインをもっと稼ぐには？","調理台を強化しましょう（レベル10・25・50・100で料理の価値が2倍）。シェフを雇い、スピードを上げ、画面をタップして加速しましょう。"],["お客さんが怒って帰るのはなぜ？","待ちすぎたからです。シェフを増やす、スピードを上げる、または「おちつき」ブースター 🧘 を使いましょう。"],["ゲームを閉じると進行状況は消えますか？","いいえ。自動で保存され、離れている間も最大2時間お店が稼ぎ続けます。"],["星は何に使いますか？","各都市で最大3つの星がもらえます（速いほど多い）。マップで永久アップグレードに使いましょう。"],["ジェムを無料で手に入れるには？","実績、ミッション、都市クリア、デイリーボーナス、ローザおばあちゃんのノート、イベント、そしてショップで1日5本までの動画で手に入ります。"],["ローザおばあちゃんのノートとは？📒","各都市の料理、特別なお客さん、イベントのコレクションです。ページを埋めるとジェムがもらえます。"],["イベントとは？🎉","コインの価値が上がる特別な日です。ゴールデンウィークエンドや各都市のお祭りなど。イベント中に遊ぶとスタンプがもらえます。"],["広告を見る必要はありますか？","いいえ。📺 のボタンをタップしてごほうびをもらうときだけ動画が流れます。"],["購入したのに届きません。","⚙️ › 🛍️（購入を復元）をタップしてください。解決しない場合は、Google Play の注文番号を添えてメールでご連絡ください。"],["コードはどこで使いますか？🎟️","⚙️ › 🎟️ で入力します。各コードは1台につき1回だけ使えます。"],["オフラインで遊べますか？","はい。通信が必要なのは動画と購入だけです。"]],"ch":"お知らせ","n":["お店の金庫がいっぱい！コインを回収しに来てね。🪙","ローザおばあちゃんがカウンターにプレゼントを置いていったよ。🎁","ゴールデンウィークエンド：日曜までぜんぶ ×1.5！🌟","お客さんがあなたを待っています。コンベアもさみしがってるよ！🌀"],"s":["シェフがエッグタルトでジャグリング中。","ローザおばあちゃんは、コンベアがひとりでに回っていると言い張っています。","VIPのお客さんがコインをもう3回も数えています。","イワシが休暇を申請したけど、だれも聞いてくれません。"],"c":["お店をのぞいてみて！👀","キッチンに戻ろう！🍳","お客さんが待ってるよ！🍽️"]},"ko":{"t":"도움말","q":[["코인을 더 많이 벌려면?","조리대를 업그레이드하세요(10, 25, 50, 100레벨에서 요리 가치가 2배). 셰프를 고용하고 속도를 올리고 화면을 탭해 가속하세요."],["손님이 화내며 떠나는 이유는?","너무 오래 기다렸기 때문이에요. 셰프를 늘리거나 속도를 올리거나 '진정' 부스터 🧘를 사용하세요."],["게임을 끄면 진행 상황이 사라지나요?","아니요. 자동으로 저장되며 자리를 비운 동안에도 최대 2시간까지 계속 벌어요."],["별은 어디에 쓰나요?","도시마다 최대 3개의 별을 받을 수 있어요(빠를수록 더 많이). 지도에서 영구 업그레이드에 사용하세요."],["보석을 무료로 얻으려면?","업적, 미션, 도시 클리어, 일일 보상, 로사 할머니의 노트, 이벤트, 그리고 상점에서 하루 최대 5개의 영상으로 얻을 수 있어요."],["로사 할머니의 노트란? 📒","도시별 요리, 특별 손님, 이벤트를 모으는 컬렉션이에요. 페이지를 채우면 보석을 받아요."],["이벤트란? 🎉","코인 가치가 올라가는 특별한 날이에요. 황금 주말이나 도시별 축제 등이 있어요. 이벤트 기간에 플레이하면 스탬프를 받아요."],["광고를 꼭 봐야 하나요?","아니요. 보상을 받으려고 📺 버튼을 탭할 때만 영상이 나와요."],["구매한 상품을 받지 못했어요.","⚙️ › 🛍️(구매 복원)을 탭하세요. 해결되지 않으면 Google Play 주문 번호와 함께 이메일을 보내 주세요."],["코드는 어디에 입력하나요? 🎟️","⚙️ › 🎟️에서 입력하세요. 각 코드는 휴대폰 한 대당 한 번만 사용할 수 있어요."],["오프라인으로 플레이할 수 있나요?","네. 영상과 구매만 인터넷 연결이 필요해요."]],"ch":"알림","n":["식당 금고가 가득 찼어요! 코인을 받으러 오세요. 🪙","로사 할머니가 카운터에 선물을 두고 가셨어요. 🎁","황금 주말: 일요일까지 모든 수익 ×1.5! 🌟","손님들이 당신을 찾고 있어요. 컨베이어도 보고 싶대요! 🌀"],"s":["셰프가 에그타르트로 저글링을 하고 있어요.","로사 할머니는 컨베이어가 저절로 돈다고 장담하세요.","VIP 손님이 벌써 코인을 세 번이나 셌어요.","정어리가 휴가를 신청했는데 아무도 안 들어줬어요."],"c":["식당을 둘러보세요! 👀","주방으로 돌아오세요! 🍳","손님들이 기다려요! 🍽️"]},"hi":{"t":"मदद","q":[["ज़्यादा सिक्के कैसे कमाऊँ?","काउंटर अपग्रेड करें (लेवल 10, 25, 50 और 100 पर व्यंजन की कीमत दोगुनी होती है), शेफ़ रखें, रफ़्तार बढ़ाएँ और तेज़ करने के लिए स्क्रीन पर टैप करें।"],["ग्राहक नाराज़ होकर क्यों चले जाते हैं?","उन्होंने बहुत देर इंतज़ार किया। ज़्यादा शेफ़ रखें, रफ़्तार बढ़ाएँ या 'शांति' बूस्टर 🧘 इस्तेमाल करें।"],["गेम बंद करने पर क्या प्रगति खो जाएगी?","नहीं। गेम अपने आप सेव होता है और आपके दूर रहने पर भी 2 घंटे तक कमाता रहता है।"],["सितारे किस काम के हैं?","हर शहर में 3 सितारे तक मिलते हैं (जितना तेज़, उतने ज़्यादा)। इन्हें मैप पर स्थायी अपग्रेड में खर्च करें।"],["मुफ़्त में रत्न कैसे पाऊँ?","उपलब्धियों, मिशनों, पूरे किए गए शहरों, रोज़ाना इनाम, रोज़ा दादी की डायरी और इवेंट्स से, और दुकान में रोज़ 5 वीडियो तक देखकर।"],["रोज़ा दादी की डायरी क्या है? 📒","हर शहर के व्यंजनों, खास ग्राहकों और इवेंट्स का संग्रह। रत्न पाने के लिए पन्ने पूरे करें।"],["इवेंट्स क्या हैं? 🎉","खास दिन जब सिक्कों की कीमत बढ़ जाती है, जैसे सुनहरा वीकेंड या हर शहर के त्योहार। इवेंट के दौरान खेलें और उसकी मुहर पाएँ।"],["क्या विज्ञापन देखना ज़रूरी है?","नहीं। वीडियो तभी चलता है जब आप इनाम पाने के लिए 📺 वाला बटन टैप करते हैं।"],["खरीदारी मिली नहीं। क्या करूँ?","⚙️ › 🛍️ (खरीदारी बहाल करें) पर टैप करें। फिर भी हल न हो तो Google Play ऑर्डर नंबर के साथ हमें ईमेल करें।"],["कोड कहाँ डालूँ? 🎟️","⚙️ › 🎟️ में। हर कोड एक फ़ोन पर सिर्फ़ एक बार इस्तेमाल हो सकता है।"],["क्या बिना इंटरनेट खेल सकते हैं?","हाँ। सिर्फ़ वीडियो और खरीदारी के लिए इंटरनेट चाहिए।"]],"ch":"रिमाइंडर","n":["रेस्टोरेंट की तिजोरी भर गई है! आकर सिक्के ले लें। 🪙","रोज़ा दादी काउंटर पर आपके लिए एक तोहफ़ा छोड़ गई हैं। 🎁","सुनहरा वीकेंड: रविवार तक सब कुछ ×1.5! 🌟","ग्राहक आपके बारे में पूछ रहे हैं। बेल्ट को आपकी याद आ रही है! 🌀"],"s":["आपका शेफ़ एग टार्ट से करतब दिखा रहा है।","रोज़ा दादी कसम खाती हैं कि बेल्ट अपने आप घूम रही है।","एक VIP ग्राहक अपने सिक्के तीन बार गिन चुका है।","सार्डिन मछली ने छुट्टी माँगी, पर किसी ने नहीं सुनी।"],"c":["रेस्टोरेंट पर एक नज़र डालें! 👀","किचन में लौट आइए! 🍳","ग्राहक इंतज़ार कर रहे हैं! 🍽️"]},"bn":{"t":"সাহায্য","q":[["কীভাবে আরও কয়েন আয় করব?","কাউন্টার আপগ্রেড করো (লেভেল ১০, ২৫, ৫০ ও ১০০-তে খাবারের দাম দ্বিগুণ হয়), শেফ রাখো, গতি বাড়াও আর দ্রুত করতে স্ক্রিনে ট্যাপ করো।"],["অতিথিরা রাগ করে চলে যায় কেন?","তারা অনেকক্ষণ অপেক্ষা করেছে। আরও শেফ রাখো, গতি বাড়াও বা 'শান্তি' বুস্টার 🧘 ব্যবহার করো।"],["গেম বন্ধ করলে কি অগ্রগতি হারিয়ে যাবে?","না। গেম নিজে থেকেই সেভ হয় আর তুমি দূরে থাকলেও ২ ঘণ্টা পর্যন্ত আয় করতে থাকে।"],["তারা দিয়ে কী হয়?","প্রতিটি শহরে ৩টি পর্যন্ত তারা পাওয়া যায় (যত দ্রুত, তত বেশি)। ম্যাপে স্থায়ী আপগ্রেডে এগুলো খরচ করো।"],["বিনা মূল্যে রত্ন কীভাবে পাব?","অর্জন, মিশন, শেষ করা শহর, দৈনিক পুরস্কার, রোজা দাদির খাতা, ইভেন্ট আর দোকানে দিনে ৫টি পর্যন্ত ভিডিও দেখে।"],["রোজা দাদির খাতা কী? 📒","প্রতিটি শহরের খাবার, বিশেষ অতিথি আর ইভেন্টের সংগ্রহ। রত্ন পেতে পাতাগুলো পূর্ণ করো।"],["ইভেন্ট কী? 🎉","বিশেষ দিন, যখন কয়েনের দাম বাড়ে, যেমন সোনালি উইকেন্ড বা শহরের উৎসব। ইভেন্টের সময় খেললে তার সিল পাবে।"],["বিজ্ঞাপন দেখা কি বাধ্যতামূলক?","না। পুরস্কার পেতে 📺 চিহ্নের বোতামে ট্যাপ করলেই শুধু ভিডিও চলে।"],["কেনা জিনিস পাইনি। কী করব?","⚙️ › 🛍️ (কেনাকাটা পুনরুদ্ধার) ট্যাপ করো। তাতেও না হলে Google Play অর্ডার নম্বরসহ আমাদের ইমেইল করো।"],["কোড কোথায় ব্যবহার করব? 🎟️","⚙️ › 🎟️-এ। প্রতিটি কোড একটি ফোনে শুধু একবার ব্যবহার করা যায়।"],["ইন্টারনেট ছাড়া কি খেলা যায়?","হ্যাঁ। শুধু ভিডিও আর কেনাকাটার জন্য সংযোগ লাগে।"]],"ch":"রিমাইন্ডার","n":["রেস্তোরাঁর ক্যাশবাক্স ভরে গেছে! এসে কয়েনগুলো তুলে নাও। 🪙","রোজা দাদি কাউন্টারে তোমার জন্য একটা উপহার রেখে গেছেন। 🎁","সোনালি উইকেন্ড: রবিবার পর্যন্ত সবকিছু ×1.5! 🌟","অতিথিরা তোমার খোঁজ করছে। বেল্টটা তোমাকে মিস করছে! 🌀"],"s":["তোমার শেফ এগ টার্ট নিয়ে জাগলিং করছে।","রোজা দাদি কসম খেয়ে বলেন, বেল্টটা নিজে নিজেই ঘুরছে।","এক ভিআইপি অতিথি ইতিমধ্যে তিনবার কয়েন গুনে ফেলেছে।","সার্ডিন মাছটা ছুটি চেয়েছিল, কিন্তু কেউ শোনেনি।"],"c":["রেস্তোরাঁয় একবার উঁকি দাও! 👀","রান্নাঘরে ফিরে এসো! 🍳","অতিথিরা অপেক্ষা করছে! 🍽️"]},"ur":{"t":"مدد","q":[["مزید سکے کیسے کماؤں؟","کاؤنٹر اپ گریڈ کریں (لیول 10، 25، 50 اور 100 پر ڈش کی قیمت دگنی ہو جاتی ہے)، شیف رکھیں، رفتار بڑھائیں اور تیز کرنے کے لیے اسکرین کو ٹیپ کریں۔"],["گاہک ناراض ہو کر کیوں چلے جاتے ہیں؟","انہوں نے بہت دیر انتظار کیا۔ مزید شیف رکھیں، رفتار بڑھائیں یا 'سکون' بوسٹر 🧘 استعمال کریں۔"],["کیا گیم بند کرنے سے پیش رفت ختم ہو جائے گی؟","نہیں۔ گیم خود محفوظ ہوتا ہے اور آپ کی غیر موجودگی میں بھی 2 گھنٹے تک کماتا رہتا ہے۔"],["ستارے کس کام آتے ہیں؟","ہر شہر میں 3 ستارے تک ملتے ہیں (جتنی تیزی، اتنے زیادہ)۔ انہیں نقشے پر مستقل اپ گریڈز پر خرچ کریں۔"],["مفت جواہرات کیسے حاصل کروں؟","کامیابیوں، مشنز، مکمل شہروں، روزانہ انعام، دادی روزا کی ڈائری اور ایونٹس سے، اور دکان میں روزانہ 5 ویڈیوز تک دیکھ کر۔"],["دادی روزا کی ڈائری کیا ہے؟ 📒","ہر شہر کی ڈشز، خاص گاہکوں اور ایونٹس کا مجموعہ۔ جواہرات پانے کے لیے صفحات مکمل کریں۔"],["ایونٹس کیا ہیں؟ 🎉","خاص دن جب سکوں کی قدر بڑھ جاتی ہے، جیسے سنہری ویک اینڈ یا ہر شہر کے تہوار۔ ایونٹ کے دوران کھیل کر اس کی مہر حاصل کریں۔"],["کیا اشتہار دیکھنا ضروری ہے؟","نہیں۔ ویڈیو صرف تب چلتی ہے جب آپ انعام کے لیے 📺 والا بٹن ٹیپ کرتے ہیں۔"],["خریداری موصول نہیں ہوئی۔ کیا کروں؟","⚙️ › 🛍️ (خریداریاں بحال کریں) پر ٹیپ کریں۔ پھر بھی حل نہ ہو تو Google Play آرڈر نمبر کے ساتھ ہمیں ای میل کریں۔"],["کوڈ کہاں استعمال کروں؟ 🎟️","⚙️ › 🎟️ میں۔ ہر کوڈ ایک فون پر صرف ایک بار استعمال ہو سکتا ہے۔"],["کیا انٹرنیٹ کے بغیر کھیل سکتے ہیں؟","جی ہاں۔ صرف ویڈیوز اور خریداری کے لیے کنکشن درکار ہے۔"]],"ch":"یاد دہانیاں","n":["ریسٹورنٹ کی تجوری بھر گئی ہے! آ کر سکے لے لیں۔ 🪙","دادی روزا کاؤنٹر پر آپ کے لیے ایک تحفہ چھوڑ گئی ہیں۔ 🎁","سنہری ویک اینڈ: اتوار تک ہر چیز ×1.5! 🌟","گاہک آپ کے بارے میں پوچھ رہے ہیں۔ بیلٹ آپ کو یاد کر رہی ہے! 🌀"],"s":["آپ کا شیف ایگ ٹارٹس سے کرتب دکھا رہا ہے۔","دادی روزا قسم کھاتی ہیں کہ بیلٹ خود بخود گھوم رہی ہے۔","ایک وی آئی پی گاہک اپنے سکے تین بار گن چکا ہے۔","سارڈین نے چھٹی مانگی، مگر کسی نے نہیں سنی۔"],"c":["ریسٹورنٹ پر ایک نظر ڈالیں! 👀","کچن میں واپس آئیں! 🍳","گاہک انتظار کر رہے ہیں! 🍽️"]},"id":{"t":"Bantuan","q":[["Bagaimana cara dapat lebih banyak koin?","Tingkatkan stan (level 10, 25, 50, dan 100 menggandakan nilai hidangan), rekrut koki, naikkan kecepatan, dan ketuk layar untuk mempercepat."],["Kenapa pelanggan pergi dengan marah?","Mereka menunggu terlalu lama. Rekrut lebih banyak koki, naikkan kecepatan, atau pakai booster Tenang 🧘."],["Apakah progres hilang kalau game ditutup?","Tidak. Game menyimpan otomatis dan tetap menghasilkan hingga 2 jam saat kamu pergi."],["Bintang untuk apa?","Kamu bisa dapat hingga 3 bintang per kota (makin cepat, makin banyak). Gunakan di peta untuk peningkatan permanen."],["Bagaimana cara dapat permata gratis?","Dari pencapaian, misi, kota yang selesai, hadiah harian, Buku Catatan Nenek Rosa, event, dan hingga 5 video per hari di toko."],["Apa itu Buku Catatan Nenek Rosa? 📒","Koleksi hidangan, pelanggan spesial, dan event dari setiap kota. Lengkapi halamannya untuk dapat permata."],["Apa itu event? 🎉","Hari spesial saat koin bernilai lebih, seperti akhir pekan emas atau festival tiap kota. Main saat event untuk dapat capnya."],["Apakah harus menonton iklan?","Tidak. Video hanya diputar saat kamu mengetuk tombol 📺 untuk dapat hadiah."],["Pembelian tidak diterima. Apa yang harus dilakukan?","Ketuk ⚙️ › 🛍️ (pulihkan pembelian). Kalau masih belum, kirim email ke kami dengan nomor pesanan Google Play."],["Di mana memakai kode? 🎟️","Di ⚙️ › 🎟️. Setiap kode hanya bisa dipakai sekali per ponsel."],["Bisa main tanpa internet?","Bisa. Hanya video dan pembelian yang butuh koneksi."]],"ch":"Pengingat","n":["Brankas restoran sudah penuh! Ayo ambil koinmu. 🪙","Nenek Rosa meninggalkan hadiah untukmu di meja. 🎁","Akhir pekan emas: semuanya bernilai ×1,5 sampai Minggu! 🌟","Pelanggan menanyakanmu. Ban berjalannya rindu! 🌀"],"s":["Kokimu sedang main sulap dengan pastel de nata.","Nenek Rosa bersumpah ban berjalannya berputar sendiri.","Pelanggan VIP sudah menghitung koinnya tiga kali.","Si sarden minta cuti, tapi tak ada yang mendengar."],"c":["Intip restoranmu! 👀","Kembali ke dapur! 🍳","Pelanggan sudah menunggu! 🍽️"]},"vi":{"t":"Trợ giúp","q":[["Làm sao kiếm thêm xu?","Nâng cấp quầy nấu (cấp 10, 25, 50 và 100 nhân đôi giá trị món ăn), thuê đầu bếp, tăng tốc độ và chạm màn hình để tăng tốc."],["Vì sao khách bỏ đi với vẻ tức giận?","Họ đã chờ quá lâu. Thuê thêm đầu bếp, tăng tốc độ hoặc dùng vật phẩm Bình tĩnh 🧘."],["Tắt trò chơi có mất tiến trình không?","Không. Trò chơi tự lưu và vẫn tiếp tục kiếm tiền tối đa 2 giờ khi bạn vắng mặt."],["Ngôi sao dùng để làm gì?","Mỗi thành phố cho tối đa 3 sao (càng nhanh càng nhiều). Dùng sao trên bản đồ để nâng cấp vĩnh viễn."],["Làm sao nhận đá quý miễn phí?","Từ thành tích, nhiệm vụ, thành phố đã hoàn thành, q يو إلا عندما تلمس زرًا عليه 📺 للحصول على مكافأة."],["لم تصلني مشترياتي. ماذا أفعل؟","المس ⚙️ › 🛍️ (استعادة المشتريات). إن لم تُحل المشكلة، راسلنا مع رقم طلب Google Play."],["أين أستخدم الرمز؟ 🎟️","في ⚙️ › 🎟️. يمكن استخدام كل رمز مرة واحدة فقط على كل هاتف."],["هل يمكنني اللعب دون إنترنت؟","نعم. الفيديوهات والمشتريات فقط تحتاج إلى اتصال."]],"ch":"تذكيرات","n":["خزنة المطعم ممتلئة! تعال واجمع عملاتك. 🪙","تركت لك الجدة روزا هدية على المنضدة. 🎁","عطلة نهاية الأسبوع الذهبية: كل شيء ×1.5 حتى الأحد! 🌟","الزبائن يسألون عنك. الحزام اشتاق إليك! 🌀"],"s":["طاهيك يتلاعب بفطائر الكسترد في الهواء.","تقسم الجدة روزا أن الحزام يدور من تلقاء نفسه.","زبون مميز عدّ عملاته ثلاث مرات بالفعل.","طلبت السردينة إجازة، لكن لم يسمعها أحد."],"c":["ألقِ نظرة على المطعم! 👀","عُد إلى المطبخ! 🍳","الزبائن بانتظارك! 🍽️"]}};

let LO=null;try{LO=JSON.parse(localStorage.getItem('spinfeast_lo')||'null');}catch(e){LO=null;}
const loOk=o=>!!(o&&typeof o==='object'&&o.v===1);
function remoteEvents(){if(!loOk(LO)||!Array.isArray(LO.events))return [];const out=[];
 for(const e of LO.events.slice(0,30)){if(!e||typeof e!=='object'||typeof e.id!=='string'||!/^[a-z0-9_]{1,24}$/.test(e.id))continue;
  if(e.city!==undefined&&!(Number.isInteger(e.city)&&e.city>=-1&&e.city<LEVELS.length))continue;const city=e.city===undefined?-1:e.city;
  const food=city>=0&&Number.isInteger(e.food)&&e.food>=0&&e.food<NF?e.food:undefined;
  const mul=typeof e.mul==='number'&&e.mul>=1&&e.mul<=3?e.mul:1.5;
  const icon=typeof e.icon==='string'&&e.icon.length>0&&[...e.icon].length<=4?e.icon:'🎉';
  const st=Date.parse(String(e.start)+'T00:00:00'),en=Date.parse(String(e.end)+'T00:00:00');if(!(st<=en))continue;
  out.push({id:'r_'+e.id,icon,city,food,mul,start:st,end:en+864e5});}
 return out;}
let EVC=null,EVC_LO=null;
function allEvents(){if(EVC&&EVC_LO===LO)return EVC;const off=loOk(LO)&&Array.isArray(LO.off)?LO.off:[];
 EVC=EVENTS.filter(e=>off.indexOf(e.id)<0).concat(remoteEvents());EVC_LO=LO;return EVC;}
function evActive(e,d){const t=d.getTime();if(e.start!==undefined)return t>=e.start&&t<e.end;
 if(e.days)return e.days.indexOf(d.getDay())>=0;
 const md=(d.getMonth()+1)*100+d.getDate(),a=e.from[0]*100+e.from[1],b=e.to[0]*100+e.to[1];return a<=b?(md>=a&&md<=b):(md>=a||md<=b);}
let LE={t:-1e9,v:[]};
function liveNow(){const now=Date.now();if(now-LE.t>5000||now<LE.t){const d=new Date();LE={t:now,v:allEvents().filter(e=>evActive(e,d))};}return LE.v;}
const isLive=e=>liveNow().some(x=>x.id===e.id);
function liveFor(l){return liveNow().filter(e=>e.city<0||e.city===l);}
function liveMul(l,food){let m=1;for(const e of liveFor(l))if(e.food===undefined||e.food===food)m*=e.mul;return m;}
function liveEnds(e){if(e.start!==undefined)return e.end;const d=new Date();d.setHours(0,0,0,0);
 for(let i=0;i<60;i++){d.setDate(d.getDate()+1);if(!evActive(e,d))return d.getTime();}return d.getTime();}
const evLeft=e=>{const s=(liveEnds(e)-Date.now())/1000;return '⏳ '+(s>=172800?Math.ceil(s/86400)+' 📅':fmtTime(s));};

const CODES={
 '2d8ca85d7e31fd71384100e57ff2f7324930c7e9ba343d4e954c13146edbe052':{g:100},      // lançamento com influenciadores
 'c930a8f67676bcd88006680868874e49740e14e9eaa5eecb54b8db4c73c3441e':{g:30,b:1}};  // seguidores da IWO Games
function codeTable(){const t=Object.assign({},CODES);
 if(loOk(LO)&&LO.codes&&typeof LO.codes==='object')for(const h in LO.codes){const r=LO.codes[h];
  if(/^[0-9a-f]{64}$/.test(h)&&r&&typeof r==='object')t[h]={g:Math.max(0,Math.min(500,r.g|0)),b:Math.max(0,Math.min(5,r.b|0))};}
 return t;}
async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function redeem(raw){const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!S.codeFail||typeof S.codeFail!=='object')S.codeFail={n:0,until:0};const f=S.codeFail;
 if(Date.now()<f.until)return{e:'wait',s:(f.until-Date.now())/1000};
 if(code.length<4||code.length>24)return{e:'bad'};
 let h;try{h=await sha256hex('spinfeast:'+code);}catch(e){return{e:'bad'};}
 if(S.codes.indexOf(h)>=0)return{e:'used'};
 const r=codeTable()[h];
 if(!r){f.n=(f.n|0)+1;if(f.n>=5){f.n=0;f.until=Date.now()+600000;}save();SFX.deny();return{e:'bad'};}
 f.n=0;S.codes.push(h);if(r.g)S.gems+=r.g;if(r.b)for(const k of BKEYS)S.boosts[k]+=r.b;
 save();SFX.claim();buzz(30);burst(360,560,100);return{ok:1,g:r.g||0,b:r.b||0};}

   if(L_===2){ctx.beginPath();ctx.ellipse(x,yy+14,10,13,0,0,7);ctx.fill();ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=INK;ctx.fillRect(x-6,yy,12,3);ctx.fillRect(x-6,yy+25,12,3);}
   else{ctx.beginPath();ctx.moveTo(x-11,yy);ctx.lineTo(x+11,yy);ctx.lineTo(x,yy+20);ctx.closePath();ctx.fill();ctx.lineWidth=2;ctx.stroke();}}}
 for(const d of th.deco){ctx.font=d[3]+'px '+EF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d[0],d[1],d[2]);}
 const dx=34,dy=360,dw=652,dh=740;
 ctx.fillStyle=INK;rr(dx-14,dy-14,dw+28,dh+28,18);ctx.fill();ctx.fillStyle=th.rim;rr(dx-10,dy-10,dw+20,dh+20,14);ctx.fill();
 ctx.fillStyle=th.deck;ctx.fillRect(dx,dy,dw,dh);
 ctx.strokeStyle=th.plank;ctx.lineWidth=2;
 if(shape==='loop'){for(let y=dy;y<dy+dh;y+=92)for(let x=dx;x<dx+dw;x+=184){const v=((x+y)/92)%2;ctx.strokeRect(x+2,y+2,v?88:180,v?180:88);}}
 else if(shape==='snake'){for(let y=dy;y<dy+dh;y+=40)for(let x=dx+((y-dy)/40%2)*40;x<dx+dw;x+=80){ctx.fillStyle='rgba(0,0,0,.07)';ctx.fillRect(x,y,40,40);}}
 else for(let y=dy+30;y<dy+dh;y+=30){ctx.beginPath();ctx.moveTo(dx,y);ctx.lineTo(dx+dw,y);ctx.stroke();for(let k=0;k<3;k++){const xx=dx+R_()*dw;ctx.beginPath();ctx.moveTo(xx,y-30);ctx.lineTo(xx,y);ctx.stroke();}}
 const vg=ctx.createRadialGradient(360,700,200,360,700,520);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,30,10,.22)');ctx.fillStyle=vg;ctx.fillRect(dx,dy,dw,dh);
 ctx.font='40px '+EF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(L_===2?'🎍':'🪴',dx+26,dy+28);ctx.fillText(L_===2?'🎍':'🪴',dx+dw-26,dy+28);
 for(let x=dx;x<=dx+dw;x+=dw/8){candyLite(x-8,dy-20,16,22,th.rim);}
 ctx.fillStyle=INK;ctx.fillRect(dx-4,996,dw+8,100);ctx.fillStyle=th.rim;ctx.fillRect(dx,1000,dw,92);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(dx,1000,dw,10);
 ctx.fillStyle='#8fc6e8';ctx.fillRect(dx-10,1092,dw+20,18);ctx.fillStyle='#bfe2f5';ctx.fillRect(dx-10,1092,dw+20,5);ctx.fillStyle=INK;ctx.fillRect(dx-10,1110,dw+20,3);
 ctx=o;
}
function candyLite(x,y,w,h,col){ctx.fillStyle=col;rr(x,y,w,h,5);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x+3,y+3,w-6,4);}

// ---------- ações ----------
function act(type,i){
 if(type==='chef'){const c=CHEF_COST[R.chefs-1];if(R.chefs<MAX_CHEFS&&R.coins>=c){R.coins-=c;addChef(R.chefs,true);R.chefs++;addStat('chefs');return true;}return false;}
 if(type==='spd'){const c=spdCost(R.spd);if(R.spd<MAX_SPD&&R.coins>=c){R.coins-=c;R.spd++;addStat('spd');return true;}return false;}
 if(type==='st'){if(R.unl[i]){const lv=R.lv[i],c=lvCost(i,lv);if(lv<MAX_LV&&R.coins>=c){R.coins-=c;R.lv[i]++;addStat('lvlup');return milestone(R.lv[i])>milestone(lv)?'mile':true;}return false;}
  if(i===nextLocked()&&R.coins>=UNLOCK_COST[i]){R.coins-=UNLOCK_COST[i];R.unl[i]=true;R.lv[i]=1;addStat('unl');quake=1;return 'unl';}return false;}
 if(type==='mission'){if(mDone()){const m=curMission(),rw=mReward(m);gain(rw,false);if(m.g)S.gems+=m.g;S.mi++;addStat('missions');S.mBase=stat(curMission().k);return rw;}return false;}
 return false;
}
const inR=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
// áreas de toque maiores que o desenho (a Google pede ~48 dp ≈ 96 px do jogo); só crescem para espaços livres, sem pisar botões vizinhos
const inP=(b,x,y,l,r,t,u)=>x>=b.x-l&&x<=b.x+b.w+r&&y>=b.y-t&&y<=b.y+b.h+u;
const HP={map:[12,8,10,6],set:[2,12,38,6],shop:[12,2,38,6],achb:[2,2,38,6],mset:[16,5,22,34],mvip:[30,20,25,25],mission:[0,0,0,4],ad:[8,12,2,14],mOk:[0,0,16,16],mAd:[0,0,16,16]};
const HB={turbo:[20,6,8,4],gold:[20,6,4,10],helper:[6,20,8,4],calm:[6,20,4,10]};
const inK=(k,x,y)=>{const p=HP[k];return inP(BTN[k],x,y,p[0],p[1],p[2],p[3]);};
const inBB=(k,x,y)=>{const p=HB[k];return inP(BB(k),x,y,p[0],p[1],p[2],p[3]);};
function denied(k){shake[k]=1;SFX.deny();buzz(15);}
function bought(k,x,y,txt){press[k]=1;SFX.buy();buzz(12);if(txt)texts.push({x,y,s:txt,t:0,col:'#fff'});save();}
function showAd(cb){
 if(noAdsOn()){cb();return;}
 if(NATIVE){if(adCb&&Date.now()-adAt<120000)return;adCb=cb;adAt=Date.now();adsReady=false;try{SpinNative.showRewarded();}catch(e){adCb=null;}return;}
 modal={type:'ad',t:3,cb};} // fora do Android: anúncio simulado de 3 s
cv.addEventListener('pointerdown',e=>{
 audioInit();
 const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/scale-oy;let x=(e.clientX-r.left)/scale;if(isRTL())x=W-x;
 if(modal){
  if(modal.type==='story'||modal.type==='city'){storyInput(x,y);return;}
  if(modal.type==='codex'){codexInput(x,y);return;}
  if(modal.type==='notif'){notifAskInput(x,y);return;}
  if(['shop','ach','daily','settings','howto','vip'].includes(modal.type)){modalInput(x,y);return;}
  if(modal.type==='welcome'){const amt=modal.amt;
   if(inK('mOk',x,y)){modal=null;gain(amt,false);SFX.claim();burst(360,560,50);save();}
   else if(inK('mAd',x,y)&&adOk())showAd(()=>{gain(amt*2,false);SFX.claim();burst(360,560,90);save();});}
  else if(modal.type==='done'){const py=400,a={x:130,y:py+370,w:220,h:70},b={x:370,y:py+370,w:220,h:70},m=modal;
   if(!m.adUsed&&adOk()&&inP(a,x,y,0,0,16,16))showAd(()=>{S.stars++;m.adUsed=true;modal=m;SFX.claim();burst(360,660,80);save();});
   else if(inP(b,x,y,0,0,16,16)){modal=null;S.run=null;goMap();burst(360,640,60);}}
  return;}
 if(screen==='map'){
  if(inK('mset',x,y)){openModal('settings');SFX.tap();return;}
  if(inK('mvip',x,y)){openModal('vip');SFX.tap();return;}
  for(let i=0;i<NAV_ITEMS.length;i++)if(inR(NAV(i),x,y)){if(NAV_ITEMS[i]==='codex')openCodex();else openModal(NAV_ITEMS[i]);SFX.tap();return;}
  for(let l=0;l<LEVELS.length;l++)if(inR(CARD(l),x,y)){if(l>0&&S.best[l-1]===0){denied('card'+l);return;}press['card'+l]=1;SFX.buy();startLevel(l);return;}
  for(let i=0;i<4;i++)if(inR(METAB(i),x,y)){const k=META_KEYS[i],m=META[k],lvl=S.meta[k];
   if(lvl<m.cost.length&&S.stars>=m.cost[lvl]){S.stars-=m.cost[lvl];S.meta[k]++;press['meta'+k]=1;SFX.unlock();buzz(25);burst(METAB(i).x+77,METAB(i).y+60,50);save();}
   else denied('meta'+k);return;}
  return;}
 if(inK('map',x,y)){goMap();SFX.tap();return;}
 if(inK('set',x,y)){openModal('settings');SFX.tap();return;}
 if(inK('shop',x,y)){openModal('shop');SFX.tap();return;}
 if(inK('achb',x,y)){openModal('ach');SFX.tap();return;}
 for(const k of BKEYS)if(inBB(k,x,y)){if(bActive(k))return;if(useBoost(k)){press['b'+k]=1;SFX.unlock();buzz(25);burst(BB(k).x+52,BB(k).y+30,40);save();}else{openModal('shop');SFX.tap();}return;}
 if(inK('mission',x,y)){const rw=act('mission');if(rw!==false){press.mission=1;SFX.claim();buzz(25);burst(BTN.mission.x+BTN.mission.w-60,BTN.mission.y+24,60);texts.push({x:240,y:200,s:'+'+fmt(rw),t:0,col:'#ffd23f'});save();}else denied('mission');return;}
 if(inR(BTN.goal,x,y))return;
 if(VIPS.on&&inP(VIPB,x,y,0,0,6,14)){showAd(()=>{if(!R)return;const a=vipAmt();gain(a,false);vipD().n++;VIPS.on=false;VIPS.next=150+Math.random()*60;SFX.claim();buzz(25);burst(VIPB.x+VIPB.w/2,VIPB.y+20,60);texts.push({x:360,y:240,s:'+'+fmt(a),t:0,col:'#ffd23f'});save();});return;}
 if(subOn()&&inK('ad',x,y)){openModal('vip');SFX.tap();return;}
 if(S.dishes>=40&&inK('ad',x,y)){if(S.adUntil-Date.now()<=AD_CAP-AD_STEP&&adOk()){press.ad=1;showAd(()=>{S.adUntil=Math.max(Date.now(),S.adUntil)+AD_STEP;SFX.claim();burst(600,170,50);save();});}return;}
 if(inR(BTN.chef,x,y)){if(act('chef'))bought('chef',240,1100,TX.newChef);else denied('chef');return;}
 if(inR(BTN.spd,x,y)){if(act('spd'))bought('spd',480,1100,TX.faster);else denied('spd');return;}
 for(let i=0;i<NF;i++){if(Math.abs(x-sx(i))<40&&y>ST_Y-40&&y<ST_Y+42){const lv=R.lv[i],res=act('st',i);
   if(res==='unl'){bought('st'+i,sx(i),ST_Y-60,fe(i)+' !');burst(sx(i),ST_Y-20,80);SFX.unlock();buzz(35);}
   else if(res){bought('st'+i,sx(i),ST_Y-60,res==='mile'?'x2!':'+'+fmt(V[i]*tipMult()*(R.lv[i]*milestone(R.lv[i])-lv*milestone(lv))));if(res==='mile'){burst(sx(i),ST_Y-20,60);SFX.unlock();}}
   else denied('st'+i);return;}}
 if(mechTap(x,y))return;
 boost=Math.min(3,boost+0.35);S.taps++;ripples.push({x,y,t:0});SFX.tap();
});

// ---------- menu de idiomas ----------
const menuEl=document.createElement('div');
menuEl.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;font-family:'+UI;
const box=document.createElement('div');
box.style.cssText='background:#fff;border-radius:18px;width:min(88vw,380px);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)';
const head=document.createElement('div');head.style.cssText='padding:14px 18px;font-weight:700;font-size:18px;background:#2f86e0;color:#fff;display:flex;justify-content:space-between;align-items:center';
const listEl=document.createElement('div');listEl.style.cssText='overflow-y:auto;padding:6px 0';
box.appendChild(head);box.appendChild(listEl);menuEl.appendChild(box);document.body.appendChild(menuEl);
menuEl.addEventListener('pointerdown',e=>{if(e.target===menuEl)menuEl.style.display='none';});
function openLangMenu(){
 head.innerHTML='';const t=document.createElement('span');t.textContent='🌐 '+TX.lang;const xx=document.createElement('span');xx.textContent='✕';xx.style.cursor='pointer';xx.onclick=()=>menuEl.style.display='none';head.appendChild(t);head.appendChild(xx);
 listEl.innerHTML='';
 for(const code of Object.keys(LANGS)){const b=document.createElement('button');b.textContent=LANGS[code][10];
  b.dir='auto';b.style.cssText='display:block;width:100%;text-align:start;border:0;background:'+(code===LANG?'#eaf4ff':'#fff')+';padding:12px 20px;font-size:17px;font-weight:'+(code===LANG?'700':'400')+';color:#222;cursor:pointer;border-bottom:1px solid #eee;font-family:inherit';
  b.onclick=()=>{setLang(code);S.lang=code;save();menuEl.style.display='none';};listEl.appendChild(b);}
 menuEl.style.display='flex';}

// ---------- ciclo ----------
const EXTMAX=560; // máximo de espaço extra (ecrãs até ~9:23); acima disto sobra uma faixa escura em baixo
function resize(){dpr=Math.min(window.devicePixelRatio||1,QDPR[qlev()]);scale=Math.min(innerWidth/W,innerHeight/H);
 Hc=H;if(innerWidth/W<=innerHeight/H)Hc=Math.min(innerHeight/scale,H+EXTMAX); // ecrã mais alto que 9:16: a cena fica ao centro e o resto é preenchido
 oy=Math.round((Hc-H)/2);ob=Hc-H-oy;
 cv.style.width=W*scale+'px';cv.style.height=Hc*scale+'px';cv.width=Math.round(W*scale*dpr);cv.height=Math.round(Hc*scale*dpr);for(const k in BG)delete BG[k];}
addEventListener('resize',resize);resize();
if(S.run){const lastSeen=S.last;startLevel(S.run.lvl);
 if(lastSeen&&S.run.ips>0&&!S.run.done){const secs=Math.min(7200,(Date.now()-lastSeen)/1000);if(secs>60){const amt=Math.floor(S.run.ips*secs*0.5);if(amt>0)modal={type:'welcome',amt,secs};}}}
if(!S.run&&!S.story)modal={type:'story',i:0};else if(!S.run&&dailyReady())modal={type:'daily'};
let last=performance.now(),lastRaf=last,lastDraw=0,gSum=0,gN=0,gBad=0,gWarm=last+4000;
function govern(now){const iv=now-lastRaf;lastRaf=now;
 if(document.hidden||iv>2000||adCb||now<gWarm){gSum=0;gN=0;if(iv>2000)gWarm=Math.max(gWarm,now+1500);return;}
 gSum+=Math.min(iv,120);gN++;
 if(gSum>=3000){const avg=gSum/gN;gSum=0;gN=0;
  if(avg>26){if(++gBad>=2){gBad=0;QL=Math.min(2,QL+1);try{localStorage.setItem('sf_q',JSON.stringify({l:QL,t:Date.now()}));}catch(e){}resize();gWarm=now+2500;try{console.info('SF-QUALIDADE nivel',QL,'dpr',dpr);}catch(e){}}}else gBad=0;}}
function loop(now){
 const ql=qlev();if(ql>=2&&now-lastDraw<28){requestAnimationFrame(loop);return;}
 lastDraw=now;if(ql<2)govern(now);
 let dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;
 const rdt=dt*dbg;subT+=dt;if(subT>5){subT=0;subDaily();}realTick(rdt);fxTick(dt);ambientTick(dt*(bActive('turbo')?2:1));
 if(screen==='play'&&R){let sim=rdt;if(boost>0){boost-=dt;sim*=1.5;}if(bActive('turbo'))sim*=2;const n=Math.max(1,Math.ceil(sim/0.025));for(let k=0;k<n;k++)update(sim/n);}
 else T+=dt;
 draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
let hiddenAt=0;
function awayEarnings(){const away=(Date.now()-hiddenAt)/1000;hiddenAt=0;
 if(!(away>60)||!R||screen!=='play'||modal||adCb||R.done||!(R.ips>0))return;
 const amt=Math.floor(R.ips*Math.min(7200,away)*0.5);if(amt>0)modal={type:'welcome',amt,secs:Math.min(7200,away)};}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){save();hiddenAt=adCb?0:Date.now();try{if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}catch(_){}}
 else{lastRaf=performance.now();gWarm=lastRaf+2500;gSum=0;gN=0;try{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}catch(_){}if(hiddenAt)awayEarnings();}
 notifSync(document.hidden);});
addEventListener('pagehide',()=>{save();notifSync(true);});
notifSync(false);loFetch();
})();
